<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Felipe Jaques, desenvolvedor de software full stack. Projetos, experiência e contato." />
    <meta name="theme-color" content="#f3f5ee" />
    <meta property="og:title" content="Felipe Jaques | Desenvolvedor de software" />
    <meta property="og:description" content="Software útil, escalável e confiável. Conheça projetos e trajetória." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      try {
        const savedTheme = localStorage.getItem('portfolio-theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (prefersDark ? 'dark' : 'light')
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>Felipe Jaques | Desenvolvedor de software</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
